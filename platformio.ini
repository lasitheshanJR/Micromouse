; PlatformIO Project Configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = bluepill_f103c8

; Shared settings for every STM32-based environment
[common]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
upload_flags =
    -c
    reset_config none

; Main maze-solving / line-following firmware (src/main.cpp)
[env:bluepill_f103c8]
extends = common

; Motor driver bench test (testing/src/motor_driver.cpp)
[env:motor_test]
extends = common
build_src_filter = +<../testing/src/motor_driver.cpp>

; 6x IR sensor diagnostic (testing/src/ir_working.cpp)
[env:ir_test]
extends = common
build_src_filter = +<../testing/src/ir_working.cpp>

; Native mms simulator build - runs on the host, not the board.
; Uses the shared core (src/mouse.cpp) with the SimIO bridge.
[env:sim]
platform = native
build_src_filter = +<../sim/> +<../src/mouse.cpp>
build_flags = -std=c++17
